<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מערכת עדכונים - משחק החוף</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: white;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header-panel {
            width: 100%;
            max-width: 500px;
            background: #333;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 15px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            color: #2c3e50;
        }
        .btn-blue { background-color: #e3f2fd; }
        .btn-orange { background-color: #fff3e0; }
        
        .game-container {
            width: 100%;
            max-width: 500px;
            position: relative;
            aspect-ratio: 2 / 1;
            background-image: url('background.png');
            background-size: cover;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .wheel {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 4px solid gold;
            background: conic-gradient(red, orange, yellow, green, blue, purple, red);
            transition: transform 3s ease-out;
        }
        .chat-panel {
            width: 100%;
            max-width: 500px;
            margin-top: 15px;
            background: white;
            border-radius: 20px;
            padding: 5px 15px;
            display: flex;
            align-items: center;
        }
        .chat-input {
            width: 100%;
            border: none;
            outline: none;
            font-size: 16px;
            padding: 10px;
            direction: rtl;
        }
    </style>
</head>
<body>

    <!-- לוח הבקרה העליון -->
    <div class="header-panel">
        <h3 style="margin:5px;">מערכת עדכונים 🔽</h3>
        <button class="btn btn-blue" onclick="alert('פונקציית משתתפים')">🎮 הכנס / הוצא משתתפים</button>
        <button class="btn btn-orange" onclick="spinWheel()">🎉 הגרל משתמש</button>
    </div>

    <!-- זירת המשחק עם החוף וגלגל המזל -->
    <div class="game-container">
        <div class="wheel" id="lucky-wheel"></div>
    </div>

    <!-- תיבת הצ'אט התחתונה -->
    <div class="chat-panel">
        <input type="text" class="chat-input" placeholder="הקלד/י כאן...">
    </div>

    <script>
        function spinWheel() {
            const wheel = document.getElementById('lucky-wheel');
            const randomDegrees = Math.floor(Math.random() * 360) + 1440; // סיבוב של לפחות 4 פעמים
            wheel.style.transform = `rotate(${randomDegrees}deg)`;
        }
    </script>
</body>
</html>
